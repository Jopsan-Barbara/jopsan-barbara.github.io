<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9da583"/><stop offset=".40" stop-color="#a9ad8c"/><stop offset=".72" stop-color="#929e7e"/><stop offset="1" stop-color="#8e9c7f"/></linearGradient>
 <filter id="wash" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".009 .012" numOctaves="3" seed="12" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer></filter>
 <radialGradient id="light" cx=".5" cy=".35" r=".7"><stop stop-color="#f3edc5" stop-opacity=".18"/><stop offset=".45" stop-color="#f3edc5" stop-opacity=".04"/><stop offset="1" stop-color="#4b6452" stop-opacity=".15"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sage)"/>
<g filter="url(#wash)" opacity=".72">
 <ellipse cx="240" cy="180" rx="380" ry="320" fill="#d1c9a0" opacity=".4"/>
 <ellipse cx="1280" cy="205" rx="410" ry="230" fill="#657954" opacity=".25"/>
 <ellipse cx="115" cy="840" rx="425" ry="300" fill="#798b67" opacity=".47"/>
 <ellipse cx="1350" cy="690" rx="430" ry="330" fill="#d3c8a8" opacity=".27"/>
 <ellipse cx="780" cy="450" rx="530" ry="460" fill="#c2c6a5" opacity=".18"/>
 <ellipse cx="520" cy="660" rx="210" ry="160" fill="#f2e9c5" opacity=".2"/>
</g>
<rect width="1600" height="900" fill="url(#light)"/>
<rect width="1600" height="900" fill="#eee6bd" filter="url(#grain)" opacity=".22"/>
</svg>