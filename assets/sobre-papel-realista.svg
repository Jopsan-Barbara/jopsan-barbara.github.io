<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
 <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".047 .065" numOctaves="4" seed="9" stitchTiles="stitch" result="noise"/>
   <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
   <feComponentTransfer in="gray" result="faint"><feFuncA type="linear" slope=".16"/></feComponentTransfer>
   <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
 </filter>
 <filter id="thread">
   <feTurbulence type="fractalNoise" baseFrequency=".7 .09" numOctaves="3" seed="14" result="n"/>
   <feColorMatrix in="n" type="saturate" values="0"/>
   <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
 </filter>
 <radialGradient id="shade"><stop stop-color="#fffcf4"/><stop offset=".65" stop-color="#f7f0e2"/><stop offset="1" stop-color="#e9ddc8"/></radialGradient>
</defs>
<rect width="512" height="512" fill="url(#shade)"/>
<rect width="512" height="512" filter="url(#fibers)" fill="#c8b99f" opacity=".19"/>
<rect width="512" height="512" filter="url(#thread)" fill="#fff" opacity=".4"/>
<g fill="none" stroke="#d5c9b4" opacity=".32" stroke-linecap="round">
<path d="M23 39q12 4 28-2 M150 73q28-1 43 5 M257 143q14 3 29-2 M322 275q16-4 38 1 M35 392q29 1 51-7 M423 423q16 3 22-5"/>
<path d="M78 132q18-2 39 5 M408 81q10 2 22-2 M235 334q12-2 24 6 M292 472q16-5 25 1"/>
</g>
</svg>