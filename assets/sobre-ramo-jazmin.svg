<svg xmlns="http://www.w3.org/2000/svg" width="290" height="290" viewBox="0 0 290 290" fill="none" role="img" aria-label="Ramillete de flores blancas con hojas oliva">
<defs>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#87926f"/><stop offset=".55" stop-color="#526842"/><stop offset="1" stop-color="#2f4c37"/></linearGradient>
  <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2b497"/><stop offset=".6" stop-color="#7d8c64"/><stop offset="1" stop-color="#566d48"/></linearGradient>
  <radialGradient id="petal"><stop stop-color="#fffef9"/><stop offset=".7" stop-color="#f8f7eb"/><stop offset="1" stop-color="#d7dbc8"/></radialGradient>
  <radialGradient id="petal2"><stop stop-color="#fffdf7"/><stop offset=".78" stop-color="#f1f1e4"/><stop offset="1" stop-color="#d3d7c5"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#f7e7b2"/><stop offset=".6" stop-color="#dec687"/><stop offset="1" stop-color="#9a8b55"/></radialGradient>
  <filter id="soft-shadow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/><feOffset dy="1"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
