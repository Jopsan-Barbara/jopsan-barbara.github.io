<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Diagnóstico API V2</title></head><body><main><h1>Diagnóstico temporal de API</h1><p id="result">Comprobando…</p></main><script>
(async () => {
const out=document.getElementById('result');
try {
  const response=await fetch('https://shakirachile.cl/jb-api/api.php',{
    method:'POST',mode:'cors',credentials:'omit',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kind:'public-rsvp',requestId:'jb-00000000-0000-4000-8000-000000000000',fullName:'Prueba de validación sin registro',email:'correo-invalido',attends:'INVALIDO',diet:''})
  });
  const data=await response.json();
  const m=String(data.message||'');
  const version=response.status===422 && m.includes('correo electrónico')?'PHP V2 CONFIRMADO':response.status===422 && m.includes('Selecciona si asistirás')?'PHP ANTIGUO':`REVISAR RESPUESTA (${response.status})`;
  out.textContent=version+' | HTTP '+response.status+' | '+m;
} catch(e){out.textContent='ERROR CONEXIÓN: '+e.message}
})();
</script></body></html>
